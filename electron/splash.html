<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        -webkit-user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      }
      img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e2e8f0;
        border-top-color: #16a34a;
        border-radius: 50%;
        animation: girar 0.8s linear infinite;
      }
      @keyframes girar {
        to { transform: rotate(360deg); }
      }
      p {
        margin: 0;
        color: #64748b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <img src="logo.png" alt="Fort Fruit" />
    <div class="spinner"></div>
    <p>Abrindo PDV Fort Fruit…</p>
  </body>
</html>
